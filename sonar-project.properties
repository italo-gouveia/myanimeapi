sonar.projectKey=italo-gouveia_myanimeapi
sonar.organization=italo-gouveia

# ── Sources ───────────────────────────────────────────────────────────────────
# Repo root — exclusions below carve out non-Go and generated trees.
sonar.sources=.

# ── Language hints ────────────────────────────────────────────────────────────
# Suppress "analyzed as all Python 3 versions" warning in SonarCloud.
sonar.python.version=3.12

# ── Go coverage ───────────────────────────────────────────────────────────────
# Both profiles are generated by sonar-main.yml and pr.yml before the scan step.
sonar.go.coverage.reportPaths=coverage-unit.out,coverage-integration.out

# ── Source exclusions (not scanned at all) ────────────────────────────────────
sonar.exclusions=\
  frontend/**,\
  **/node_modules/**,\
  **/vendor/**,\
  api/adapters/graphql/generated/**,\
  cmd/docs/**,\
  load-test/**,\
  **/*.pb.go,\
  **/*.gen.go

# ── Coverage exclusions (scanned for issues, but not counted in coverage %) ───
sonar.coverage.exclusions=\
  **/*_test.go,\
  api/mocks/**,\
  tests/mocks/**,\
  tests/**,\
  api/adapters/graphql/generated/**,\
  cmd/docs/**,\
  internal/etl/jikan/**

# ── Test file detection ───────────────────────────────────────────────────────
sonar.test.inclusions=**/*_test.go,tests/**/*.go
sonar.test.exclusions=vendor/**,node_modules/**
