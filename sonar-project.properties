sonar.projectKey=italo-gouveia_myanimeapi
sonar.organization=italo-gouveia

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=.

# ── Language hints ────────────────────────────────────────────────────────────
sonar.python.version=3.12

# ── Go coverage ───────────────────────────────────────────────────────────────
sonar.go.coverage.reportPaths=coverage-unit.out,coverage-integration.out

# ── JavaScript / TypeScript coverage (Vitest → lcov) ─────────────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Quality gate ──────────────────────────────────────────────────────────────
# The GitHub Actions scanner waits for the QG result by default; this makes the
# intent explicit and documents the gate contract.
#
# Active gate: "myanimeapi strict" (configure at
#   https://sonarcloud.io/organizations/italo-gouveia/quality_gates)
#
# Required conditions on NEW code:
#   • Coverage              ≥ 80 %
#   • New Bugs              = 0        (Reliability A on new code)
#   • New Vulnerabilities   = 0        (Security A on new code)
#   • New Code Smells       = 0        (Maintainability A on new code)
#   • Duplicated lines (%)  ≤ 3 %
#   • Security Hotspots reviewed = 100 %
#
# Any PR that introduces a violation in one of the above will block merging.
sonar.qualitygate.wait=true

# New-code baseline: diff against the target branch on PRs; against the
# previous version tag on branch builds. This keeps "new code" tight and
# avoids false positives from pre-existing legacy lines.
sonar.newCode.referenceBranch=main

# ── Source exclusions (not scanned at all) ────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  api/adapters/graphql/generated/**,\
  api/mocks/**,\
  tests/mocks/**,\
  cmd/docs/**,\
  load-test/**,\
  **/*.pb.go,\
  **/*.gen.go,\
  frontend/dist/**,\
  frontend/coverage/**,\
  frontend/*.config.ts,\
  frontend/*.config.js,\
  frontend/*.config.mjs,\
  frontend/*.config.cjs

# ── Coverage exclusions (scanned for issues, not counted in coverage %) ───────
sonar.coverage.exclusions=\
  api/adapters/http/character_handler.go,\
  api/repositories/**,\
  **/*_test.go,\
  **/*.test.tsx,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.spec.ts,\
  api/mocks/**,\
  tests/mocks/**,\
  tests/**,\
  api/adapters/graphql/generated/**,\
  cmd/docs/**,\
  internal/etl/jikan/**,\
  frontend/src/test/**,\
  frontend/src/pages/**,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/*.config.ts,\
  frontend/*.config.js,\
  frontend/*.config.mjs,\
  frontend/*.config.cjs

# ── CPD exclusions (test files have inherently repetitive arrange/act/assert patterns) ─
# user_handler.go is excluded because its many handlers share a structural boilerplate
# (logFields setup → userID check → GetByID) that is unavoidable in HTTP handlers.
sonar.cpd.exclusions=\
  **/*_test.go,\
  tests/**,\
  **/*.test.tsx,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.spec.ts,\
  api/adapters/http/user_handler.go

# ── Test file detection ───────────────────────────────────────────────────────
sonar.test.inclusions=\
  **/*_test.go,\
  tests/**/*.go,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.spec.tsx,\
  frontend/src/**/*.spec.ts
sonar.test.exclusions=vendor/**,node_modules/**
