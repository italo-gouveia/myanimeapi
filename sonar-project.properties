sonar.projectKey=italo-gouveia_myanimeapi
sonar.organization=italo-gouveia

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=.

# ── Language hints ────────────────────────────────────────────────────────────
sonar.python.version=3.12

# ── Go coverage ───────────────────────────────────────────────────────────────
sonar.go.coverage.reportPaths=coverage-unit.out,coverage-integration.out

# ── JavaScript / TypeScript coverage (Vitest → lcov) ─────────────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Source exclusions (not scanned at all) ────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  api/adapters/graphql/generated/**,\
  api/mocks/**,\
  tests/mocks/**,\
  cmd/docs/**,\
  load-test/**,\
  **/*.pb.go,\
  **/*.gen.go,\
  frontend/dist/**,\
  frontend/coverage/**,\
  frontend/*.config.ts,\
  frontend/*.config.js,\
  frontend/*.config.mjs,\
  frontend/*.config.cjs

# ── Coverage exclusions (scanned for issues, not counted in coverage %) ───────
sonar.coverage.exclusions=\
  api/adapters/http/character_handler.go,\
  api/repositories/character_repository.go,\
  **/*_test.go,\
  **/*.test.tsx,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.spec.ts,\
  api/mocks/**,\
  tests/mocks/**,\
  tests/**,\
  api/adapters/graphql/generated/**,\
  cmd/docs/**,\
  internal/etl/jikan/**,\
  frontend/src/test/**,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/*.config.ts,\
  frontend/*.config.js,\
  frontend/*.config.mjs,\
  frontend/*.config.cjs

# ── CPD exclusions (test files have inherently repetitive arrange/act/assert patterns) ─
sonar.cpd.exclusions=\
  **/*_test.go,\
  tests/**,\
  **/*.test.tsx,\
  **/*.test.ts,\
  **/*.spec.tsx,\
  **/*.spec.ts

# ── Test file detection ───────────────────────────────────────────────────────
sonar.test.inclusions=\
  **/*_test.go,\
  tests/**/*.go,\
  frontend/src/**/*.test.tsx,\
  frontend/src/**/*.test.ts,\
  frontend/src/**/*.spec.tsx,\
  frontend/src/**/*.spec.ts
sonar.test.exclusions=vendor/**,node_modules/**
