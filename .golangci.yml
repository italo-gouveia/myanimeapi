version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-use-default: false
  exclude-rules:
    - path: frontend
      linters:
        - govet
        - staticcheck
        - errcheck
        - ineffassign
        - unused
