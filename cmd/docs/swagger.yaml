basePath: /v1
definitions:
  errors.ErrorResponse:
    properties:
      error:
        properties:
          code:
            description: A unique error code for categorization.
            type: string
          context:
            additionalProperties: true
            description: Additional context fields for debugging.
            type: object
          details:
            description: Additional context or details about the error.
            type: string
          message:
            description: A human-readable error message.
            type: string
        type: object
    type: object
  httphandler.AdminStats:
    properties:
      anime_total:
        type: integer
      favorites_total:
        type: integer
      genres_total:
        type: integer
      reviews_total:
        type: integer
      tags_total:
        type: integer
      users_total:
        type: integer
      with_cover_total:
        type: integer
    type: object
  httphandler.UpdateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  httphandler.watchlistGrouped:
    additionalProperties:
      items:
        $ref: '#/definitions/models.WatchlistEntryResponse'
      type: array
    type: object
  httphandler.watchlistResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/models.WatchlistEntryResponse'
        type: array
      grouped:
        $ref: '#/definitions/httphandler.watchlistGrouped'
    type: object
  models.Anime:
    properties:
      characters:
        description: Associated characters
        items:
          $ref: '#/definitions/models.Character'
        type: array
      cover_url:
        description: Cover image URL (populated by ETL)
        example: https://cdn.myanimelist.net/…
        type: string
      created_at:
        description: Timestamp when the anime was added
        example: "2025-02-20T19:27:00Z"
        type: string
      description:
        description: Description of the anime
        example: A story about ninjas.
        type: string
      end_date:
        description: Date when the anime finished airing
        example: "2007-02-08T00:00:00Z"
        type: string
      episodes:
        description: Number of episodes
        example: 220
        type: integer
      genres:
        description: Associated genres
        items:
          $ref: '#/definitions/models.Genre'
        type: array
      id:
        description: Unique identifier for the anime
        example: 1
        type: integer
      mal_id:
        description: MyAnimeList ID (used for ETL deduplication)
        example: 20
        type: integer
      rating:
        description: Average rating of the anime
        example: 8.5
        type: number
      reviews:
        description: Associated reviews
        items:
          $ref: '#/definitions/models.Review'
        type: array
      start_date:
        description: Date when the anime started airing
        example: "2002-10-03T00:00:00Z"
        type: string
      status:
        description: Current status of the anime
        example: Completed
        type: string
      tags:
        description: Associated tags
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        description: Title of the anime
        example: Naruto
        type: string
      updated_at:
        description: Timestamp when the anime was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.AnimeCharacterRequest:
    properties:
      character_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - character_ids
    type: object
  models.AnimeCreateRequest:
    properties:
      description:
        description: Description of the anime
        example: A story about ninjas.
        type: string
      end_date:
        description: Date when the anime finished airing
        example: "2007-02-08T00:00:00Z"
        type: string
      episodes:
        description: Number of episodes
        example: 220
        type: integer
      genre_ids:
        description: IDs of genres to associate with the anime
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      rating:
        description: Initial rating for the anime
        example: 8.5
        maximum: 10
        minimum: 0
        type: number
      start_date:
        description: Date when the anime started airing
        example: "2002-10-03T00:00:00Z"
        type: string
      status:
        description: Current status of the anime
        example: Completed
        type: string
      tag_ids:
        description: IDs of tags to associate with the anime
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      title:
        description: Title of the anime
        example: Naruto
        type: string
    required:
    - episodes
    - rating
    - start_date
    - status
    - title
    type: object
  models.AnimeResponse:
    properties:
      characters:
        description: Associated characters
        items:
          $ref: '#/definitions/models.CharacterResponse'
        type: array
      cover_url:
        description: Cover image URL
        example: https://cdn.myanimelist.net/images/…
        type: string
      created_at:
        description: Timestamp when the anime was added
        example: "2025-02-20T19:27:00Z"
        type: string
      description:
        description: Description of the anime
        example: A story about ninjas.
        type: string
      end_date:
        description: Date when the anime finished airing
        example: "2007-02-08T00:00:00Z"
        type: string
      episodes:
        description: Number of episodes
        example: 220
        type: integer
      genres:
        description: Associated genres
        items:
          $ref: '#/definitions/models.Genre'
        type: array
      id:
        description: Unique identifier for the anime
        example: 1
        type: integer
      mal_id:
        description: MyAnimeList ID
        example: 20
        type: integer
      rating:
        description: Average rating of the anime
        example: 8.5
        type: number
      reviews:
        description: Associated reviews (includes username)
        items:
          $ref: '#/definitions/models.AnimeReviewEntry'
        type: array
      start_date:
        description: Date when the anime started airing
        example: "2002-10-03T00:00:00Z"
        type: string
      status:
        description: Current status of the anime
        example: Completed
        type: string
      tags:
        description: Associated tags
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        description: Title of the anime
        example: Naruto
        type: string
      updated_at:
        description: Timestamp when the anime was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.AnimeReviewEntry:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      rating:
        type: integer
      updated_at:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  models.Character:
    properties:
      animes:
        description: Anime appearances
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      deleted_at:
        description: Soft delete timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      description:
        description: Brief description
        example: The main protagonist.
        maxLength: 1000
        type: string
      id:
        description: Unique identifier
        example: 1
        type: integer
      image_url:
        description: Image URL
        example: https://cdn.example.com/naruto.jpg
        type: string
      name:
        description: Character name
        example: Naruto Uzumaki
        maxLength: 150
        type: string
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      voice_actor:
        description: Voice actor name
        example: Junko Takeuchi
        maxLength: 150
        type: string
    required:
    - name
    type: object
  models.CharacterCreateRequest:
    properties:
      description:
        example: The main protagonist.
        maxLength: 1000
        type: string
      image_url:
        example: https://cdn.example.com/naruto.jpg
        type: string
      name:
        example: Naruto Uzumaki
        maxLength: 150
        type: string
      voice_actor:
        example: Junko Takeuchi
        maxLength: 150
        type: string
    required:
    - name
    type: object
  models.CharacterListResponse:
    properties:
      characters:
        items:
          $ref: '#/definitions/models.CharacterResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
    type: object
  models.CharacterResponse:
    properties:
      description:
        example: The main protagonist.
        type: string
      id:
        example: 1
        type: integer
      image_url:
        example: https://cdn.example.com/naruto.jpg
        type: string
      name:
        example: Naruto Uzumaki
        type: string
      voice_actor:
        example: Junko Takeuchi
        type: string
    type: object
  models.CharacterUpdateRequest:
    properties:
      description:
        example: The main protagonist.
        maxLength: 1000
        type: string
      image_url:
        example: https://cdn.example.com/naruto.jpg
        type: string
      name:
        example: Naruto Uzumaki
        maxLength: 150
        type: string
      voice_actor:
        example: Junko Takeuchi
        maxLength: 150
        type: string
    type: object
  models.Favorite:
    properties:
      anime:
        allOf:
        - $ref: '#/definitions/models.Anime'
        description: Associated anime details
      anime_id:
        description: ID of the favorited anime
        example: 1
        type: integer
      created_at:
        description: Timestamp when the favorite was created
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the favorite entry
        example: 1
        type: integer
      updated_at:
        description: Timestamp when the favorite was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Associated user details
      user_id:
        description: ID of the user who favorited the anime
        example: 1
        type: integer
    type: object
  models.Genre:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      deleted_at:
        description: Soft delete timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the genre
        example: 1
        type: integer
      name:
        description: Name of the genre
        example: Action
        type: string
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.GenreResponse:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      id:
        description: Unique identifier for the genre
        example: 1
        type: integer
      name:
        description: Name of the genre
        example: Action
        type: string
    type: object
  models.JSON:
    additionalProperties: true
    type: object
  models.MediaAttachment:
    properties:
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Media attachment ID
        example: 1
        type: integer
      review_id:
        description: Review ID with cascade delete constraint
        example: 1
        type: integer
      type:
        description: Type of media (image or video)
        enum:
        - image
        - video
        example: image
        type: string
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      url:
        description: URL to the media file
        example: https://example.com/image.jpg
        type: string
    required:
    - type
    - url
    type: object
  models.Response:
    properties:
      data:
        description: Data payload (can be any type)
      message:
        description: Message describing the result
        example: Operation successful
        type: string
      status:
        description: Status of the response (success, error)
        example: success
        type: string
    type: object
  models.Review:
    properties:
      animeId:
        description: Anime ID with cascade delete constraint
        example: 1
        type: integer
      content:
        description: Review content
        example: This anime is amazing!
        maxLength: 500
        type: string
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Review ID
        example: 1
        type: integer
      media_attachments:
        description: Associated media attachments
        items:
          $ref: '#/definitions/models.MediaAttachment'
        type: array
      rating:
        description: Rating (0-10)
        example: 9
        maximum: 10
        minimum: 0
        type: integer
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      userId:
        description: User ID
        example: 1
        type: integer
    required:
    - content
    - rating
    type: object
  models.Tag:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      deleted_at:
        description: Soft delete timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the tag
        example: 1
        type: integer
      name:
        description: Name of the tag
        example: Ninja
        type: string
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.TagCreateRequest:
    properties:
      name:
        description: Name of the tag
        example: Action
        maxLength: 50
        minLength: 1
        type: string
    required:
    - name
    type: object
  models.TagResponse:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      id:
        description: Unique identifier for the tag
        example: 1
        type: integer
      name:
        description: Name of the tag
        example: Ninja
        type: string
    type: object
  models.User:
    properties:
      bio:
        description: User's biography
        example: Anime enthusiast
        type: string
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      deleted_at:
        description: Soft delete timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      email:
        description: Unique Email address of the user
        example: john@example.com
        maxLength: 100
        minLength: 5
        type: string
      favorites:
        description: User's favorite anime
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      genres:
        description: User's preferred genres
        items:
          $ref: '#/definitions/models.Genre'
        type: array
      id:
        description: Unique identifier
        example: 1
        type: integer
      is_active:
        description: Indicates if the user account is active
        example: true
        type: boolean
      is_admin:
        description: Indicates if the user has admin privileges
        example: false
        type: boolean
      profile_pic:
        description: URL to the user's profile picture
        example: https://example.com/profile.jpg
        type: string
      reviews:
        description: User's reviews
        items:
          $ref: '#/definitions/models.Review'
        type: array
      role:
        description: 'RBAC role: user | reviewer | admin'
        example: user
        type: string
      social_links:
        allOf:
        - $ref: '#/definitions/models.JSON'
        description: User's social media links
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      username:
        description: Unique username for the user
        example: john_doe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  models.UserCredentials:
    properties:
      password:
        description: Password for authentication
        example: password123
        maxLength: 100
        minLength: 5
        type: string
      username:
        description: Username for authentication
        example: john_doe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  models.WatchlistEntryResponse:
    properties:
      anime:
        $ref: '#/definitions/models.AnimeResponse'
      anime_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/models.WatchlistStatus'
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.WatchlistStatus:
    enum:
    - plan_to_watch
    - watching
    - completed
    - dropped
    - on_hold
    type: string
    x-enum-varnames:
    - WatchlistStatusPlanToWatch
    - WatchlistStatusWatching
    - WatchlistStatusCompleted
    - WatchlistStatusDropped
    - WatchlistStatusOnHold
  models.WatchlistUpsertRequest:
    properties:
      status:
        $ref: '#/definitions/models.WatchlistStatus'
    required:
    - status
    type: object
  services.SyncResult:
    properties:
      errors:
        type: integer
      imported:
        type: integer
      pages:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@myanimeapi.com
    name: API Support
  description: This is a sample API for managing anime and reviews.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: MyAnimeAPI
  version: "1.0"
paths:
  /admin/analytics:
    get:
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Admin analytics
      tags:
      - admin
  /admin/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.AdminStats'
      security:
      - BearerAuth: []
      summary: Admin dashboard stats
      tags:
      - admin
  /admin/users:
    get:
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: List all users (admin)
      tags:
      - admin
  /admin/users/{id}/role:
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.UpdateRoleRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Update user role (admin)
      tags:
      - admin
  /animes:
    get:
      description: Returns a paginated, filterable, sortable list of animes.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 100)
        in: query
        name: limit
        type: integer
      - description: Filter by status
        enum:
        - Airing
        - Completed
        - Upcoming
        in: query
        name: status
        type: string
      - description: Filter by exact genre name (single)
        in: query
        name: genre
        type: string
      - description: Filter by multiple genres, comma-separated (AND logic)
        in: query
        name: genres
        type: string
      - description: Filter by exact tag name (single)
        in: query
        name: tag
        type: string
      - description: Filter by multiple tags, comma-separated (AND logic)
        in: query
        name: tags
        type: string
      - description: Minimum rating (0–10)
        in: query
        name: rating_min
        type: number
      - description: Maximum rating (0–10)
        in: query
        name: rating_max
        type: number
      - description: Minimum episode count
        in: query
        name: episodes_min
        type: integer
      - description: Maximum episode count
        in: query
        name: episodes_max
        type: integer
      - description: Start-date year lower bound (inclusive)
        in: query
        name: year_from
        type: integer
      - description: Start-date year upper bound (inclusive)
        in: query
        name: year_to
        type: integer
      - description: Sort field
        enum:
        - title
        - rating
        - episodes
        - created_at
        - start_date
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/models.AnimeResponse'
                type: array
              limit:
                type: integer
              page:
                type: integer
              total:
                type: integer
            type: object
        "400":
          description: Invalid filter or pagination
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: List animes
      tags:
      - anime
    post:
      consumes:
      - application/json
      description: Create a new anime with the provided details
      parameters:
      - description: Anime details
        in: body
        name: anime
        required: true
        schema:
          $ref: '#/definitions/models.AnimeCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AnimeResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to create anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new anime
      tags:
      - anime
  /animes/{animeId}/characters:
    get:
      description: Returns the cast of a given anime
      parameters:
      - description: Anime ID
        in: path
        name: animeId
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CharacterListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Get characters for an anime
      tags:
      - characters
    post:
      consumes:
      - application/json
      parameters:
      - description: Anime ID
        in: path
        name: animeId
        required: true
        type: integer
      - description: Character IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AnimeCharacterRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add characters to anime
      tags:
      - characters
  /animes/{animeId}/characters/{characterId}:
    delete:
      parameters:
      - description: Anime ID
        in: path
        name: animeId
        required: true
        type: integer
      - description: Character ID
        in: path
        name: characterId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove character from anime
      tags:
      - characters
  /animes/search:
    get:
      description: Returns animes whose title contains the given string. Supports
        sort and pagination.
      parameters:
      - description: Title substring to search for
        in: query
        name: title
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 100)
        in: query
        name: limit
        type: integer
      - description: Sort field
        enum:
        - title
        - rating
        - episodes
        - created_at
        - start_date
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/models.AnimeResponse'
                type: array
              limit:
                type: integer
              page:
                type: integer
              total:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Search animes by title
      tags:
      - anime
