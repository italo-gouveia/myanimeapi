basePath: /v1
definitions:
  errors.ErrorResponse:
    properties:
      error:
        properties:
          code:
            description: A unique error code for categorization.
            type: string
          details:
            description: Additional context or details about the error.
            type: string
          message:
            description: A human-readable error message.
            type: string
        type: object
    type: object
  handlers.BulkCreateGenresRequest:
    properties:
      genres:
        items:
          $ref: '#/definitions/models.Genre'
        type: array
    required:
    - genres
    type: object
  handlers.BulkDeleteGenresRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  models.Anime:
    properties:
      created_at:
        description: Timestamp when the anime was added
        example: "2025-02-20T19:27:00Z"
        type: string
      description:
        description: Description of the anime
        example: A story about ninjas.
        type: string
      end_date:
        description: Date when the anime finished airing
        example: "2007-02-08T00:00:00Z"
        type: string
      episodes:
        description: Number of episodes
        example: 220
        type: integer
      genres:
        description: Associated genres
        items:
          $ref: '#/definitions/models.Genre'
        type: array
      id:
        description: Unique identifier for the anime
        example: 1
        type: integer
      rating:
        description: Average rating of the anime
        example: 8.5
        type: number
      reviews:
        description: Associated reviews
        items:
          $ref: '#/definitions/models.Review'
        type: array
      start_date:
        description: Date when the anime started airing
        example: "2002-10-03T00:00:00Z"
        type: string
      status:
        description: Current status of the anime
        example: Completed
        type: string
      tags:
        description: Associated tags
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        description: Title of the anime
        example: Naruto
        type: string
      updated_at:
        description: Timestamp when the anime was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.AnimeCreateRequest:
    properties:
      description:
        description: Description of the anime
        example: A story about ninjas.
        type: string
      end_date:
        description: Date when the anime finished airing
        example: "2007-02-08T00:00:00Z"
        type: string
      episodes:
        description: Number of episodes
        example: 220
        type: integer
      genre_ids:
        description: IDs of genres to associate with the anime
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      rating:
        description: Initial rating for the anime
        example: 8.5
        maximum: 10
        minimum: 0
        type: number
      start_date:
        description: Date when the anime started airing
        example: "2002-10-03T00:00:00Z"
        type: string
      status:
        description: Current status of the anime
        example: Completed
        type: string
      tag_ids:
        description: IDs of tags to associate with the anime
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      title:
        description: Title of the anime
        example: Naruto
        type: string
    required:
    - episodes
    - rating
    - start_date
    - status
    - title
    type: object
  models.AnimeListResponse:
    properties:
      animes:
        description: List of anime responses
        items:
          $ref: '#/definitions/models.AnimeResponse'
        type: array
      limit:
        description: Number of items per page
        example: 10
        type: integer
      page:
        description: Current page number
        example: 1
        type: integer
      total:
        description: Total number of animes
        example: 1
        type: integer
    type: object
  models.AnimeResponse:
    properties:
      created_at:
        description: Timestamp when the anime was added
        example: "2025-02-20T19:27:00Z"
        type: string
      description:
        description: Description of the anime
        example: A story about ninjas.
        type: string
      end_date:
        description: Date when the anime finished airing
        example: "2007-02-08T00:00:00Z"
        type: string
      episodes:
        description: Number of episodes
        example: 220
        type: integer
      genres:
        description: Associated genres
        items:
          $ref: '#/definitions/models.Genre'
        type: array
      id:
        description: Unique identifier for the anime
        example: 1
        type: integer
      rating:
        description: Average rating of the anime
        example: 8.5
        type: number
      reviews:
        description: Associated reviews
        items:
          $ref: '#/definitions/models.Review'
        type: array
      start_date:
        description: Date when the anime started airing
        example: "2002-10-03T00:00:00Z"
        type: string
      status:
        description: Current status of the anime
        example: Completed
        type: string
      tags:
        description: Associated tags
        items:
          $ref: '#/definitions/models.Tag'
        type: array
      title:
        description: Title of the anime
        example: Naruto
        type: string
      updated_at:
        description: Timestamp when the anime was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.Favorite:
    properties:
      anime:
        allOf:
        - $ref: '#/definitions/models.Anime'
        description: Associated anime details
      anime_id:
        description: ID of the favorited anime
        example: 1
        type: integer
      created_at:
        description: Timestamp when the favorite was created
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the favorite entry
        example: 1
        type: integer
      updated_at:
        description: Timestamp when the favorite was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Associated user details
      user_id:
        description: ID of the user who favorited the anime
        example: 1
        type: integer
    type: object
  models.Genre:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      deleted_at:
        description: Soft delete timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the genre
        example: 1
        type: integer
      name:
        description: Name of the genre
        example: Action
        type: string
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.GenreResponse:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      id:
        description: Unique identifier for the genre
        example: 1
        type: integer
      name:
        description: Name of the genre
        example: Action
        type: string
    type: object
  models.Response:
    properties:
      data:
        description: Data payload (can be any type)
      message:
        description: Message describing the result
        example: Operation successful
        type: string
      status:
        description: Status of the response (success, error)
        example: success
        type: string
    type: object
  models.Review:
    properties:
      animeId:
        description: Anime ID with cascade delete constraint
        example: 1
        type: integer
      content:
        description: Review content
        example: This anime is amazing!
        maxLength: 500
        type: string
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Review ID
        example: 1
        type: integer
      rating:
        description: Rating (0-10)
        example: 9
        maximum: 10
        minimum: 0
        type: integer
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      userId:
        description: User ID
        example: 1
        type: integer
    required:
    - content
    - rating
    type: object
  models.ReviewCreateRequest:
    properties:
      animeId:
        description: ID of the anime being reviewed (required)
        example: 1
        type: integer
      content:
        description: Content of the review (required, max 500 characters)
        example: This anime is amazing!
        maxLength: 500
        type: string
      rating:
        description: Rating given in the review (0-10, required)
        example: 9
        maximum: 10
        minimum: 0
        type: integer
      userId:
        description: ID of the user creating the review (required)
        example: 1
        type: integer
    required:
    - animeId
    - content
    - rating
    - userId
    type: object
  models.ReviewResponse:
    properties:
      anime:
        allOf:
        - $ref: '#/definitions/models.AnimeResponse'
        description: Anime details
      animeId:
        description: ID of the anime being reviewed
        example: 1
        type: integer
      content:
        description: Content of the review
        example: This anime is amazing!
        type: string
      created_at:
        description: Timestamp when the review was created
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the review
        example: 1
        type: integer
      rating:
        description: Rating given in the review (0-10)
        example: 9
        type: integer
      updated_at:
        description: Timestamp when the review was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.UserResponse'
        description: User details
      userId:
        description: ID of the user who created the review
        example: 1
        type: integer
    type: object
  models.SuccessResponse:
    properties:
      data:
        description: Optional response data
      message:
        description: Success message
        example: Operation completed successfully
        type: string
    type: object
  models.Tag:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      created_at:
        description: Creation timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      deleted_at:
        description: Soft delete timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the tag
        example: 1
        type: integer
      name:
        description: Name of the tag
        example: Ninja
        type: string
      updated_at:
        description: Update timestamp
        example: "2025-02-20T19:27:00Z"
        type: string
    type: object
  models.TagResponse:
    properties:
      anime:
        description: Associated anime entries
        items:
          $ref: '#/definitions/models.Anime'
        type: array
      id:
        description: Unique identifier for the tag
        example: 1
        type: integer
      name:
        description: Name of the tag
        example: Ninja
        type: string
    type: object
  models.User:
    properties:
      created_at:
        description: Timestamp when the user was created
        example: "2025-02-20T19:27:00Z"
        type: string
      email:
        description: Unique Email address of the user (omitted unless necessary)
        example: john@example.com
        maxLength: 100
        minLength: 5
        type: string
      favorites:
        items:
          $ref: '#/definitions/models.Favorite'
        type: array
      id:
        description: Unique identifier for the user
        example: 1
        type: integer
      is_admin:
        description: Indicates if the user has admin privileges
        example: false
        type: boolean
      reviews:
        items:
          $ref: '#/definitions/models.Review'
        type: array
      updated_at:
        description: Timestamp when the user was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
      username:
        description: Unique username for the user
        example: john_doe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  models.UserCredentials:
    properties:
      password:
        description: Password for authentication
        example: password123
        maxLength: 100
        minLength: 5
        type: string
      username:
        description: Username for authentication
        example: john_doe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  models.UserResponse:
    properties:
      created_at:
        description: Timestamp when the user was created
        example: "2025-02-20T19:27:00Z"
        type: string
      id:
        description: Unique identifier for the user
        example: 1
        type: integer
      is_admin:
        description: Indicates if the user has admin privileges
        example: false
        type: boolean
      updated_at:
        description: Timestamp when the user was last updated
        example: "2025-02-20T19:27:00Z"
        type: string
      username:
        description: Username of the user
        example: john_doe
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@myanimeapi.com
    name: API Support
  description: This is a sample API for managing anime and reviews.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: MyAnimeAPI
  version: "1.0"
paths:
  /animes:
    get:
      description: Get a list of all animes with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AnimeListResponse'
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to retrieve animes
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Get all animes
      tags:
      - anime
    post:
      consumes:
      - application/json
      description: Create a new anime with the provided details
      parameters:
      - description: Anime details
        in: body
        name: anime
        required: true
        schema:
          $ref: '#/definitions/models.AnimeCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AnimeResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to create anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new anime
      tags:
      - anime
  /animes/{id}:
    delete:
      description: Delete an anime by its ID
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid anime ID
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to delete anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an anime
      tags:
      - anime
    get:
      description: Get an anime's details by its ID
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AnimeResponse'
        "400":
          description: Invalid anime ID
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to retrieve anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Get an anime by ID
      tags:
      - anime
    put:
      consumes:
      - application/json
      description: Update an existing anime's details
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated anime details
        in: body
        name: anime
        required: true
        schema:
          $ref: '#/definitions/models.Anime'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AnimeResponse'
        "400":
          description: Invalid anime ID or request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to update anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an anime
      tags:
      - anime
  /animes/{id}/genres:
    delete:
      consumes:
      - application/json
      description: Remove one or more genres from an existing anime
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      - description: Genre IDs to remove
        in: body
        name: genres
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid anime ID or request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to remove genres from anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove genres from an anime
      tags:
      - anime
    post:
      consumes:
      - application/json
      description: Add one or more genres to an existing anime
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      - description: Genre IDs to add
        in: body
        name: genres
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid anime ID or request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to add genres to anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add genres to an anime
      tags:
      - anime
  /animes/{id}/tags:
    delete:
      consumes:
      - application/json
      description: Remove one or more tags from an existing anime
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      - description: Tag IDs to remove
        in: body
        name: tags
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid anime ID or request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to remove tags from anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove tags from an anime
      tags:
      - anime
    post:
      consumes:
      - application/json
      description: Add one or more tags to an existing anime
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      - description: Tag IDs to add
        in: body
        name: tags
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid anime ID or request body
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "404":
          description: Anime not found
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to add tags to anime
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add tags to an anime
      tags:
      - anime
  /animes/genre/{genre}:
    get:
      description: Search for animes by genre with pagination
      parameters:
      - description: Genre to search for
        in: path
        name: genre
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AnimeListResponse'
        "400":
          description: Genre parameter is required
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to search animes by genre
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Search animes by genre
      tags:
      - anime
  /animes/search:
    get:
      description: Search for animes by title with pagination
      parameters:
      - description: Title to search for
        in: query
        name: title
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AnimeListResponse'
        "400":
          description: Title parameter is required
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
        "500":
          description: Failed to search animes by title
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Search animes by title
      tags:
      - anime
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with username and password
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.UserCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.Response'
      summary: Authenticate a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with the provided credentials
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.Response'
      summary: Register a new user
      tags:
      - auth
  /favorites:
    get:
      description: Get all favorites for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Favorite'
            type: array
        "401":
          description: Unauthorized
