scalar Time

type Character {
  id: ID!
  name: String!
  description: String
  voiceActor: String
  imageURL: String
}

type CharacterList {
  data: [Character!]!
  total: Int!
}

type Anime {
  id: ID!
  title: String!
  description: String
  rating: Float
  episodes: Int
  status: String
  startDate: Time
  endDate: Time
  genres: [Genre!]
  tags: [Tag!]
  characters: [Character!]
}

type Genre {
  id: ID!
  name: String!
}

type Tag {
  id: ID!
  name: String!
}

type User {
  id: ID!
  username: String!
  email: String!
  isAdmin: Boolean!
  isActive: Boolean!
}

type AuthPayload {
  token: String!
}

type AnimeList {
  data: [Anime!]!
  total: Int!
}

input AnimeFilterInput {
  status: String
  genre: String
  genres: [String!]
  tag: String
  tags: [String!]
  ratingMin: Float
  ratingMax: Float
  episodesMin: Int
  episodesMax: Int
  yearFrom: Int
  yearTo: Int
  sortBy: String
  sortOrder: String
}

type Query {
  anime(id: ID!): Anime
  animes(page: Int, limit: Int, filter: AnimeFilterInput): AnimeList!
  animesByTitle(title: String!, page: Int, limit: Int, sortBy: String, sortOrder: String): AnimeList!
  genre(id: ID!): Genre
  genres(page: Int, limit: Int): [Genre!]!
  character(id: ID!): Character
  characters(page: Int, limit: Int): CharacterList!
  charactersByName(name: String!, page: Int, limit: Int): CharacterList!
  charactersByAnime(animeId: ID!, page: Int, limit: Int): CharacterList!
}

type Mutation {
  register(username: String!, email: String!, password: String!): User!
  login(username: String!, password: String!): AuthPayload!
  createAnime(title: String!, description: String, episodes: Int, status: String): Anime!
  deleteAnime(id: ID!): Boolean!
  createCharacter(name: String!, description: String, voiceActor: String, imageURL: String): Character!
  updateCharacter(id: ID!, name: String, description: String, voiceActor: String, imageURL: String): Character!
  deleteCharacter(id: ID!): Boolean!
}
