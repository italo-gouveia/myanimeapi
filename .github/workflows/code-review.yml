name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review
        uses: Codium-ai/pr-agent@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          mode: review
          review_comment_lgtm: false
          review_suggestions: true
          review_estimate: true
          review_extra_instructions: |
            Você é um revisor de código experiente especializado em Go. Analise o código com foco em:
            
            1. **Qualidade do Código:**
               - Boas práticas de Go
               - Estrutura e organização
               - Nomenclatura de variáveis e funções
               - Tratamento de erros
            
            2. **Segurança:**
               - Vulnerabilidades de segurança
               - Validação de entrada
               - Exposição de dados sensíveis
            
            3. **Performance:**
               - Otimizações possíveis
               - Uso eficiente de recursos
               - Padrões de concorrência
            
            4. **Manutenibilidade:**
               - Legibilidade do código
               - Documentação
               - Testes
            
            5. **Arquitetura:**
               - Separação de responsabilidades
               - Design patterns
               - Estrutura do projeto
            
            Use emojis para categorizar os comentários: 🔧 (melhoria), 🐛 (bug), ⚠️ (aviso), 💡 (sugestão), 🔒 (segurança), ⚡ (performance).
            
            Seja específico e forneça exemplos de código quando apropriado.
