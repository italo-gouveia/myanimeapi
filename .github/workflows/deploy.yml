name: Build & Deploy

# Build always runs on push to main (images pushed to GHCR so they are ready
# whenever you want to roll them out). The deploy job is gated by the repo
# variable DEPLOY_ENABLED — set it to "true" only after the VPS is up and the
# secrets below are configured. See docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image_ref: ${{ steps.image.outputs.api_ref }}
      frontend_image_ref: ${{ steps.image.outputs.frontend_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image names
        id: image
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "api_name=${{ env.REGISTRY }}/${repo_lc}-api" >> "$GITHUB_OUTPUT"
          echo "api_ref=${{ env.REGISTRY }}/${repo_lc}-api:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_name=${{ env.REGISTRY }}/${repo_lc}-frontend" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=${{ env.REGISTRY }}/${repo_lc}-frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.api_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.frontend_name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    # Gate: only deploys when the repo variable DEPLOY_ENABLED is "true".
    # Until the VPS exists, leave it unset and the job will be skipped while
    # the build-and-push job still publishes images to GHCR.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose and provisioning to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,prometheus,grafana"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE_REF: ${{ needs.build-and-push.outputs.api_image_ref }}
          FRONTEND_IMAGE_REF: ${{ needs.build-and-push.outputs.frontend_image_ref }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: API_IMAGE_REF,FRONTEND_IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export API_IMAGE_REF FRONTEND_IMAGE_REF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
