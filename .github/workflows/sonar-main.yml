name: "SonarCloud (main)"

# Analyses the main branch after every merge and can be triggered manually.
# PR-time analysis lives in pr.yml; this workflow keeps the SonarCloud
# dashboard in sync with what is actually on main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  sonarcloud-main:
    name: "SonarCloud analysis"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: "--health-cmd \"redis-cli ping\" --health-interval 10s --health-timeout 5s --health-retries 5"
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: test
      TEST_DB_NAME: test_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: test-jwt-secret-key-at-least-32-chars-long
      # Evaluated at job level so it's available in step if: conditions.
      # (secrets context is not allowed in step-level if: for push/workflow_dispatch)
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          # Production packages only — exclude generated, mocks, test helpers and
          # DB-bound repository tests (those are covered by the integration step).
          PROD=$(go list ./... \
            | grep -v '/tests/' \
            | grep -v '/api/repositories' \
            | grep -v '/generated' \
            | grep -v '/mocks' \
            | grep -v '/cmd/docs')
          COVERPKGS=$(echo "$PROD" | tr '\n' ',' | sed 's/,$//')
          TESTPKGS=$(echo "$PROD" | grep -v '/api/repositories')
          go test -race -count=1 -timeout 120s \
            -coverprofile=coverage-unit.out \
            -coverpkg="$COVERPKGS" \
            $TESTPKGS

      - name: Run integration tests with coverage
        run: |
          PROD=$(go list ./... \
            | grep -v '/tests/' \
            | grep -v '/generated' \
            | grep -v '/mocks' \
            | grep -v '/cmd/docs')
          COVERPKGS=$(echo "$PROD" | tr '\n' ',' | sed 's/,$//')
          go test -race -count=1 -timeout 180s \
            -coverprofile=coverage-integration.out \
            -coverpkg="$COVERPKGS" \
            ./tests/integration/...

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend unit tests with coverage
        working-directory: frontend
        run: npm ci && npm run test:coverage

      - name: SonarCloud Scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: "-Dsonar.go.coverage.reportPaths=coverage-unit.out,coverage-integration.out"
