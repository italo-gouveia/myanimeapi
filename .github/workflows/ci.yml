name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-build-validation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Allow updating PR descriptions
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Pre-Build Validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<EOF
          import os
          import subprocess
          import json

          def analyze_changes():
              # Get the list of changed files
              changed_files = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"]
              ).decode("utf-8").splitlines()

              # Initialize feedback and error flag
              feedback = "## Pre-Build Validation Feedback\n"
              feedback += "The following files were modified:\n"
              has_errors = False

              # Perform checks on changed files
              for file in changed_files:
                  feedback += f"- **{file}**: Modified\n"

                  # Example: Check for sensitive data in files
                  if file.endswith(".env") or file.endswith(".json"):
                      with open(file, "r") as f:
                          content = f.read()
                          if "password" in content or "secret" in content:
                              feedback += f"  ⚠️ **Warning**: Potential sensitive data found in `{file}`.\n"
                              has_errors = True

                  # Example: Validate JSON files
                  if file.endswith(".json"):
                      try:
                          with open(file, "r") as f:
                              json.load(f)  # Validate JSON format
                      except json.JSONDecodeError:
                          feedback += f"  ❌ **Error**: Invalid JSON format in `{file}`.\n"
                          has_errors = True

                  # Example: Ensure required files are present
                  if file == "Dockerfile":
                      if not os.path.exists("Dockerfile"):
                          feedback += f"  ❌ **Error**: `Dockerfile` is missing.\n"
                          has_errors = True

              # Add a summary
              feedback += "\n### Recommendations\n"
              if has_errors:
                  feedback += "❌ **Errors were found**. Please fix them before proceeding.\n"
              else:
                  feedback += "✅ No critical issues found. Proceed with caution.\n"

              return feedback, has_errors

          def update_pr_description(description):
              # Update the PR description using the GitHub API
              pr_number = os.getenv("GITHUB_REF").split("/")[-2]
              repo = os.getenv("GITHUB_REPOSITORY")
              github_token = os.getenv("GITHUB_TOKEN")

              update_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
              headers = {
                  "Authorization": f"Bearer {github_token}",
                  "Accept": "application/vnd.github.v3+json",
              }
              data = {"body": description}

              # Use `json.dumps` to properly format the JSON payload
              json_data = json.dumps(data)

              subprocess.run(
                  [
                      "curl",
                      "-X", "PATCH",
                      "-H", f"Authorization: Bearer {github_token}",
                      "-H", "Content-Type: application/json",
                      "-d", json_data,
                      update_url,
                  ],
                  check=True,
              )

          if __name__ == "__main__":
              feedback, has_errors = analyze_changes()
              update_pr_description(feedback)

              # Fail the job if errors are found
              if has_errors:
                  print("❌ Errors detected. Failing the job.")
                  exit(1)
          EOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

  sonarcloud-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Run SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PULLREQUEST_KEY: ${{ github.event.pull_request.number }}  # Pull request number
          SONAR_PULLREQUEST_BRANCH: ${{ github.head_ref }}                # Source branch
          SONAR_PULLREQUEST_BASE: ${{ github.base_ref }}                  # Target branch

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyAnimeAPI'
          format: 'ALL'
          fail_on_cvss: 7

  swagger:
    name: Validate Swagger Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: swag init --dir ./cmd,./pkg/handlers,./pkg/models --output ./cmd/docs

      - name: Check for changes in Swagger docs
        run: git diff --exit-code

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, swagger]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myanimeapi:latest