name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-build-validation:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Allow updating PR descriptions
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Pre-Build Validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<EOF
          import os
          import subprocess
          import json

          def analyze_changes():
              # Get the list of changed files
              changed_files = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"]
              ).decode("utf-8").splitlines()

              # Analyze changes (example logic)
              feedback = "## Pre-Build Validation Feedback\n"
              feedback += "The following files were modified:\n"
              for file in changed_files:
                  feedback += f"- **{file}**: Modified\n"

              # Add a summary
              feedback += "\n### Recommendations\n"
              feedback += "1. Ensure all changes are properly tested.\n"
              feedback += "2. Verify that no sensitive data is exposed.\n"
              feedback += "3. Check for any potential build issues.\n"

              return feedback

          def update_pr_description(description):
              # Update the PR description using the GitHub API
              pr_number = os.getenv("GITHUB_REF").split("/")[-2]
              repo = os.getenv("GITHUB_REPOSITORY")
              github_token = os.getenv("GITHUB_TOKEN")

              update_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
              headers = {
                  "Authorization": f"Bearer {github_token}",
                  "Accept": "application/vnd.github.v3+json",
              }
              data = {"body": description}

              # Use `json.dumps` to properly format the JSON payload
              json_data = json.dumps(data)

              subprocess.run(
                  [
                      "curl",
                      "-X", "PATCH",
                      "-H", f"Authorization: Bearer {github_token}",
                      "-H", "Content-Type: application/json",
                      "-d", json_data,
                      update_url,
                  ],
                  check=True,
              )

          if __name__ == "__main__":
              feedback = analyze_changes()
              update_pr_description(feedback)
          EOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run tests and generate coverage report
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test]  # Ensure this job runs after lint and test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Node.js (for Semantic Release)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Semantic Release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  sonarcloud-analysis:
    runs-on: ubuntu-latest
    needs: [test]  # Ensure this job runs after the test job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Run SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PULLREQUEST_KEY: ${{ github.event.pull_request.number }}  # Pull request number
          SONAR_PULLREQUEST_BRANCH: ${{ github.head_ref }}                # Source branch
          SONAR_PULLREQUEST_BASE: ${{ github.base_ref }}                  # Target branch
          SONAR_GOLANG_COVERAGE_REPORT_PATHS: coverage.out  # Pass the coverage report to SonarCloud

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch the entire commit history

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyAnimeAPI'
          format: 'ALL'
          fail_on_cvss: 7
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
      - name: Run GitLeaks
        uses: zricethezav/gitleaks-action@v2  # Use the correct version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Pass the GITHUB_TOKEN as an environment variable
        with:
          config-path: .gitleaks.toml
          redact: true
          verbose: true
      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: './...'

  swagger:
    name: Validate Swagger Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: swag init --dir ./cmd,./pkg/handlers,./pkg/models --output ./cmd/docs

      - name: Check for changes in Swagger docs
        run: git diff --exit-code

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, swagger]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          tags: myanimeapi:latest  # Build the image locally with this tag

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myanimeapi:latest'  # Scan the locally built image
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myanimeapi:latest  # Push the image to Docker Hub