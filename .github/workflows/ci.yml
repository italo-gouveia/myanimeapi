name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-build-validation:
    name: Pre-build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run go mod tidy
        run: go mod tidy

      - name: Check for uncommitted changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::warning::Found uncommitted changes after running 'go mod tidy'"
            git diff go.mod
            echo "::warning::Please run 'go mod tidy' locally and commit the changes"
            exit 0  # Don't fail the build, just warn
          fi

      - name: Validate go.mod and go.sum
        run: |
          go mod verify
          go mod download

      - name: Check for common issues
        run: |
          # Check for TODO comments
          if grep -r "TODO:" . --include="*.go"; then
            echo "::warning::Found TODO comments in code"
          fi

          # Check for FIXME comments
          if grep -r "FIXME:" . --include="*.go"; then
            echo "::warning::Found FIXME comments in code"
          fi

          # Check for debug prints
          if grep -r "fmt.Print" . --include="*.go"; then
            echo "::warning::Found debug print statements in code"
          fi
          
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run tests and generate coverage report
        run: |
          go test -v -coverprofile=coverage.out -coverpkg=./... ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Debug workspace
        run: ls -la

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing to the repository
      issues: write    # Allow creating issues (for failed releases)
      pull-requests: write  # Allow creating pull requests (if needed)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Semantic Release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
  
  sonarcloud-analysis:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Debug downloaded files
        run: ls -la

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyAnimeAPI'
          path: '.'
          format: 'ALL'
          args: '--failOnCVSS 7 --exclude "**/vendor/**,**/node_modules/**,**/test/**,**/tests/**,**/docs/**"'

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

