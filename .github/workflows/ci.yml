name: Post-merge release

# Runs after a PR merges to main. PR-time validation lives in pr.yml —
# everything that gets here has already passed lint, tests, security,
# trivy, sonar and the swagger drift check. This workflow is only
# responsible for the versioning side-effect: semantic-release bumps the
# version, updates CHANGELOG.md and creates the GitHub release.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
