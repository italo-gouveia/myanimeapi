
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-build-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Pre-Build Validation
        run: |
          python3 - <<EOF
          import os
          import subprocess

          def analyze_changes():
              # Get the list of changed files
              changed_files = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"]
              ).decode("utf-8").splitlines()

              # Analyze changes (example logic)
              feedback = "## Pre-Build Validation Feedback\n"
              feedback += "The following files were modified:\n"
              for file in changed_files:
                  feedback += f"- **{file}**: Modified\n"

              # Add a summary
              feedback += "\n### Recommendations\n"
              feedback += "1. Ensure all changes are properly tested.\n"
              feedback += "2. Verify that no sensitive data is exposed.\n"
              feedback += "3. Check for any potential build issues.\n"

              return feedback

          if __name__ == "__main__":
              feedback = analyze_changes()
              print(feedback)
          EOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

  sonarcloud-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Run SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PULLREQUEST_KEY: ${{ github.event.pull_request.number }}  # Pull request number
          SONAR_PULLREQUEST_BRANCH: ${{ github.head_ref }}                # Source branch
          SONAR_PULLREQUEST_BASE: ${{ github.base_ref }}                  # Target branch

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyAnimeAPI'
          format: 'ALL'
          fail_on_cvss: 7

  swagger:
    name: Validate Swagger Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: swag init --dir ./cmd,./pkg/handlers,./pkg/models --output ./cmd/docs

      - name: Check for changes in Swagger docs
        run: git diff --exit-code

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, swagger]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myanimeapi:latest