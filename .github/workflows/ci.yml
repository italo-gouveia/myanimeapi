
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-build-ai-validation:
    name: AI Pre-Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install required Python packages
        run: pip install requests openai

      - name: Run AI Pre-Build Validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<EOF
          import os
          import time
          from openai import OpenAI, RateLimitError

          # Initialize OpenAI client
          try:
              client = OpenAI(api_key=os.getenv("OPENAI_API_KEY"))
          except Exception as e:
              print(f"OpenAI initialization failed: {e}")
              client = None

          def analyze_changes_with_retry(client, changed_files, retries=3, delay=5):
              if not client:
                  print("OpenAI client not initialized. Skipping analysis.")
                  return "Automated PR description generation failed. Please add a manual description."

              for attempt in range(retries):
                  try:
                      response = client.chat.completions.create(
                          model="gpt-3.5-turbo",  # Use gpt-3.5-turbo as a fallback
                          messages=[
                              {"role": "system", "content": "You are a code reviewer. Analyze the following code changes and predict potential build failures or issues."},
                              {"role": "user", "content": f"Here are the changed files: {changed_files}. Please analyze them."}
                          ]
                      )
                      return response.choices[0].message.content
                  except RateLimitError as e:
                      print(f"Rate limit exceeded. Retrying in {delay} seconds... (Attempt {attempt + 1}/{retries})")
                      if attempt < retries - 1:
                          time.sleep(delay)
                      else:
                          print("All retries failed. Skipping OpenAI analysis.")
                          return "Automated PR description generation failed due to rate limits. Please add a manual description."
                  except Exception as e:
                      print(f"OpenAI API call failed: {e}")
                      return "Automated PR description generation failed. Please add a manual description."

          # Get the list of changed files
          changed_files = os.popen("git diff --name-only HEAD^ HEAD").read().splitlines()

          # Analyze changes using OpenAI (with retry logic)
          analysis_result = analyze_changes_with_retry(client, changed_files)
          print(analysis_result)
          EOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyAnimeAPI'
          format: 'ALL'
          fail_on_cvss: 7

  swagger:
    name: Validate Swagger Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: swag init --dir ./cmd,./pkg/handlers,./pkg/models --output ./cmd/docs

      - name: Check for changes in Swagger docs
        run: git diff --exit-code

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, swagger]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myanimeapi:latest