name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  analyze-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Allow updating PR descriptions
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full Git history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Analyze changes with DeepSeek
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}  # Your DeepSeek API key
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<EOF
          import os
          import requests
          import json

          # Fetch the PR diff using GitHub API
          def fetch_pr_diff():
              pr_number = os.getenv("PR_NUMBER")
              repo = os.getenv("REPO")
              github_token = os.getenv("GITHUB_TOKEN")

              url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
              headers = {
                  "Authorization": f"Bearer {github_token}",
                  "Accept": "application/vnd.github.v3.diff",
              }
              response = requests.get(url, headers=headers)
              response.raise_for_status()
              return response.text

          # Analyze changes using DeepSeek API
          def analyze_changes_with_deepseek(diff):
              deepseek_api_key = os.getenv("DEEPSEEK_API_KEY")
              prompt = f"Analyze the following code changes and provide feedback:\n\n{diff}\n\nFeedback:"
              headers = {
                  "Authorization": f"Bearer {deepseek_api_key}",
                  "Content-Type": "application/json",
              }
              data = {
                  "model": "deepseek-coder",  # Use the appropriate DeepSeek model
                  "messages": [{"role": "user", "content": prompt}],
                  "max_tokens": 500,
              }
              response = requests.post(
                  "https://api.deepseek.com/v1/chat/completions",  # Replace with DeepSeek's API endpoint
                  headers=headers,
                  json=data,
              )
              response.raise_for_status()
              return response.json()["choices"][0]["message"]["content"]

          # Update PR description with DeepSeek feedback
          def update_pr_description(feedback):
              pr_number = os.getenv("PR_NUMBER")
              repo = os.getenv("REPO")
              github_token = os.getenv("GITHUB_TOKEN")

              update_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
              headers = {
                  "Authorization": f"Bearer {github_token}",
                  "Accept": "application/vnd.github.v3+json",
              }
              data = {"body": feedback}

              response = requests.patch(update_url, headers=headers, json=data)
              response.raise_for_status()

          if __name__ == "__main__":
              diff = fetch_pr_diff()
              feedback = analyze_changes_with_deepseek(diff)
              update_pr_description(feedback)
          EOF