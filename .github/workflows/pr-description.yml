name: AI PR Description

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install OpenAI Python client
        run: pip install openai

      - name: Generate PR Description
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<EOF
          import openai
          import os
          import requests

          openai.api_key = os.getenv("OPENAI_API_KEY")
          github_token = os.getenv("GITHUB_TOKEN")

          # Get PR details
          pr_number = os.getenv("GITHUB_REF").split("/")[-2]
          repo = os.getenv("GITHUB_REPOSITORY")
          pr_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          headers = {"Authorization": f"Bearer {github_token}"}
          pr_details = requests.get(pr_url, headers=headers).json()

          # Get changed files
          changed_files = requests.get(pr_details["url"] + "/files", headers=headers).json()

          # Generate PR description using OpenAI
          response = openai.ChatCompletion.create(
              model="gpt-4",
              messages=[
                  {"role": "system", "content": "You are a code reviewer. Analyze the following PR changes and generate a description."},
                  {"role": "user", "content": f"Here are the changed files: {changed_files}. Please generate a PR description."}
              ]
          )

          description = response['choices'][0]['message']['content']

          # Update PR description
          update_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
          requests.patch(update_url, headers=headers, json={"body": description})
          EOF