name: Test AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: write

jobs:
  test-review:
    name: Test AI Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            console.log('Current comments:', comments.length);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **AI Review Test**\n\nThis is a test comment to verify that the workflow has permission to comment on PRs.\n\nIf you see this comment, the permissions are working correctly!'
            });

      - name: Run AI Review
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          args: |
            --mode review
            --review.comment_lgtm false
            --review.suggestions true
            --review.estimate false
            --review.extra_instructions "Você é um revisor de código experiente especializado em Go. Analise o código com foco em: 1. Qualidade do Código: Boas práticas de Go, estrutura, nomenclatura, tratamento de erros. 2. Segurança: Vulnerabilidades, validação de entrada, exposição de dados sensíveis. 3. Performance: Otimizações, uso eficiente de recursos, padrões de concorrência. 4. Manutenibilidade: Legibilidade, documentação, testes. 5. Arquitetura: Separação de responsabilidades, design patterns. Use emojis: 🔧 (melhoria), 🐛 (bug), ⚠️ (aviso), 💡 (sugestão), 🔒 (segurança), ⚡ (performance). Seja específico e forneça exemplos."
