name: Security Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  security-review:
    name: Security Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install security tools
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run gosec security scan
        run: gosec -fmt=json -out=gosec-report.json ./...
        continue-on-error: true

      - name: Run golangci-lint security checks
        run: golangci-lint run --enable=gosec,gosimple,ineffassign,staticcheck ./...
        continue-on-error: true

      - name: Security Review with AI
        uses: Codium-ai/pr-agent@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          mode: review
          review_comment_lgtm: false
          review_suggestions: true
          review_estimate: false
          review_extra_instructions: |
            Você é um especialista em segurança de aplicações Go. Analise o código focando APENAS em questões de segurança:

            1. **Vulnerabilidades de Segurança:**
               - SQL Injection
               - XSS (Cross-Site Scripting)
               - CSRF (Cross-Site Request Forgery)
               - Injeção de comandos
               - Path traversal
               - Deserialização insegura

            2. **Validação e Sanitização:**
               - Validação de entrada de usuário
               - Sanitização de dados
               - Escape de caracteres especiais
               - Validação de tipos de arquivo

            3. **Autenticação e Autorização:**
               - Controle de acesso adequado
               - Verificação de permissões
               - Tokens JWT seguros
               - Senhas e hashes

            4. **Configuração Segura:**
               - Variáveis de ambiente
               - Configurações de banco de dados
               - Logs sensíveis
               - Headers de segurança

            5. **Dependências:**
               - Vulnerabilidades conhecidas
               - Versões desatualizadas
               - Dependências suspeitas

            6. **Criptografia:**
               - Uso adequado de algoritmos
               - Geração segura de chaves
               - Armazenamento de secrets

            Use apenas estes emojis para categorizar:
            🔒 (vulnerabilidade crítica), ⚠️ (risco de segurança), 💡 (sugestão de segurança), 🛡️ (boa prática de segurança)

            Seja MUITO específico sobre riscos de segurança e forneça exemplos de como corrigir.
            Se não encontrar problemas de segurança, confirme que o código está seguro.
